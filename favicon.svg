<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#roseGrad)" filter="url(#dropShadow)"/>
  <!-- Ticket Notch Details -->
  <circle cx="32" cy="256" r="32" fill="#f8fafc"/>
  <circle cx="480" cy="256" r="32" fill="#f8fafc"/>
  <!-- TV Text -->
  <text x="256" y="295" font-family="'Noto Sans KR', Arial, sans-serif" font-size="190" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-6">TV</text>
  <!-- Star Accent -->
  <polygon points="256,90 270,120 302,124 278,145 284,176 256,160 228,176 234,145 210,124 242,120" fill="#fbbf24"/>
</svg>